# Render Blueprint for The Hooded Hand.
# One Node web service serves the built client (static files) and the WebSocket game server (online tables) on the
# same port. Deploy: Render dashboard -> New -> Blueprint -> connect this repo. See HANDOFF.md, "Deploy".
services:
  - type: web
    name: the-hooded-hand
    runtime: node
    plan: free
    # Can't be changed after the service is created: pick the one nearest the players.
    # oregon | ohio | virginia | frankfurt | singapore
    region: virginia
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    # Deploy a push only once the GitHub checks (typecheck, rules sims, build) pass.
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
