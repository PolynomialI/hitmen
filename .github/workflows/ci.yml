# Checks every push: typecheck, the rules simulation suite and a full build (client + server).
# There is no GitHub Pages deploy: the owner's managed Chromebook blocks GitHub, so the game is served from Render.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
